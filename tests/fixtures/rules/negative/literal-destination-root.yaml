# NEGATIVE EXAMPLE — MUST FAIL VALIDATION
# Case: literal-destination-root
# Expected failure: destination_root_ref must be a symbolic name, never a literal path.
# Generated by scripts/generate_negative_rule_fixtures.py — do not hand-edit.
schema_version: 1
rule_set:
  id: rs-fixture-example-001
  name: Fixture classification rule set (non-production example)
  version: 1.0.0
  status: draft
  environment: fixture
  destination_root_ref: /volume1/destination
  owner: operator
  effective_from: '2026-07-31'
  approval_state: none
  priority_scheme: banded_v1
  evaluation_order:
  - safety_exclusions
  - exact_duplicate_status
  - high_certainty_source_metadata
  - explicit_path_or_filename_rules
  - deterministic_file_type_rules
  - content_or_ai_assisted_rules
  - sensitive_identity_rules_requiring_confirmation
  - unresolved_fallback
  conflict_resolution_order:
  - higher_priority_deterministic
  - lower_priority_deterministic
  - high_confidence_content
  - lower_confidence_inference
  - manual_review
  defaults:
    on_conflict: manual_review
    on_low_confidence: manual_review
    on_multi_destination: manual_review
    require_explanation: true
    dry_run_only: true
    load_order_significance: none
  notes: This rule set contains zero executable_candidate rules by design. Until OD-012
    (Dogs / drone / CSV / identity-candidate confirmation) and OD-003 (identity privacy
    policy) are resolved, every match resolves to a review item, not to a plan entry.
  source_refs:
  - docs/02-specification/rule-model.md
  - docs/05-governance/open-decisions.md
  rules:
  - id: SAFE-001-unreadable
    status: active
    band: safety
    priority: 1000
    kind: deterministic
    owner: operator
    description: Route unreadable or corrupt files to the unresolved holding area.
    rationale: An unreadable file has no trustworthy evidence, so no destination can
      be earned. Routing to Needs-Manual-Review preserves the item and makes the failure
      visible instead of silently skipping it.
    tags:
    - safety
    - unresolved
    applies_to:
      media_kinds:
      - any
    privacy_classification: none
    when:
      predicate:
        field: readability
        op: equals
        value: unreadable_or_corrupt
        evidence_source: filesystem
    then:
      outcome: route_to_review
      destination: 00_MIGRATION_CONTROL/05_Unresolved/Needs-Manual-Review
      destination_authority: advisory_only
      review_state: review_required
      explanation_template: File could not be read or parsed; routed to unresolved.
      fallback: preserve_source_and_review
    confidence:
      minimum: 1.0
      below_minimum_outcome: route_to_review
    conflict:
      mode: manual_review
      on_multi_destination: manual_review
      merge_content: false
    evidence:
      required:
      - path
      - readability
    confirmation:
      required: false
    tests:
      positive:
      - tests/fixtures/rules/safe-unreadable/positive-001.bin
      negative:
      - tests/fixtures/rules/safe-unreadable/negative-001.txt
      boundary:
      - tests/fixtures/rules/safe-unreadable/boundary-001.bin
      conflict:
      - tests/fixtures/rules/safe-unreadable/conflict-001.bin
      idempotency:
      - tests/fixtures/rules/safe-unreadable/idempotent-001.bin
  - id: MEDIA-095-drone
    status: provisional
    band: deterministic
    priority: 700
    kind: deterministic
    owner: operator
    description: Provisional drone routing from source-device, folder, or filename
      evidence.
    rationale: Drone intent may be inferred from source/device metadata or an explicit
      path or filename signal, but never from vague visual content. Provisional until
      OD-012.
    tags:
    - drone
    - provisional
    policy_ref:
    - OD-012
    applies_to:
      media_kinds:
      - image
      - video
      source_root_refs:
      - fixture_source_root
    privacy_classification: none
    when:
      any:
      - predicate:
          field: source_device
          op: any_of
          value:
          - known_drone_camera
          evidence_source: media_metadata
      - predicate:
          field: parent_path
          op: regex
          value: (^|/)[Dd]rone(/|$)
          regex_flavor: re2
          evidence_source: path
      - predicate:
          field: filename
          op: regex
          value: ^(DJI|FPV)_[0-9]{4}
          regex_flavor: re2
          evidence_source: path
    then:
      outcome: route_to_review
      destination: 30_DRONE/{capture_year}/{capture_date}
      destination_authority: advisory_only
      review_state: review_required
      explanation_template: Drone camera/metadata/path signal matched; destination
        is a provisional candidate only.
      fallback: route_to_review
    confidence:
      minimum: 0.95
      below_minimum_outcome: route_to_review
    conflict:
      mode: manual_review
      on_multi_destination: manual_review
      merge_content: false
    evidence:
      required:
      - path
      - media_metadata
      - source_device
    confirmation:
      required: true
      confirmer_role: operator
    tests:
      positive:
      - tests/fixtures/rules/media-drone/positive-001.jpg
      negative:
      - tests/fixtures/rules/media-drone/negative-001.jpg
      boundary:
      - tests/fixtures/rules/media-drone/boundary-001.mp4
      conflict:
      - tests/fixtures/rules/media-drone/conflict-001.jpg
      idempotency:
      - tests/fixtures/rules/media-drone/idempotent-001.jpg
  - id: DATA-080-csv
    status: provisional
    band: deterministic
    priority: 650
    kind: deterministic
    owner: operator
    description: Provisional CSV routing to the structured-data branch.
    rationale: Extension alone is an early routing dimension, not a semantic destination.
      Delimiter and row-count sampling must corroborate before this leaves provisional.
    tags:
    - csv
    - structured-data
    - provisional
    policy_ref:
    - OD-012
    applies_to:
      media_kinds:
      - structured_data
      extensions:
      - .csv
      source_root_refs:
      - fixture_source_root
    privacy_classification: none
    when:
      all:
      - predicate:
          field: extension
          op: equals
          value: .csv
          evidence_source: filesystem
      - predicate:
          field: source_root_ref
          op: equals
          value: fixture_source_root
          evidence_source: path
    then:
      outcome: route_to_review
      destination: 04_DATA_VAULT/Structured/CSV/{capture_year}
      destination_authority: advisory_only
      review_state: review_required
      explanation_template: CSV extension plus structured-data validation; destination
        is a provisional candidate only.
      fallback: route_to_review
      follow_up:
      - profile_structured_data
    confidence:
      minimum: 0.8
      below_minimum_outcome: route_to_review
    conflict:
      mode: manual_review
      on_multi_destination: manual_review
      merge_content: false
    evidence:
      required:
      - extension
      - delimiter
      - row_count_sample
    confirmation:
      required: true
      confirmer_role: operator
    tests:
      positive:
      - tests/fixtures/rules/data-csv/positive-001.csv
      negative:
      - tests/fixtures/rules/data-csv/negative-001.txt
      boundary:
      - tests/fixtures/rules/data-csv/boundary-001.csv
      conflict:
      - tests/fixtures/rules/data-csv/conflict-001.csv
      idempotency:
      - tests/fixtures/rules/data-csv/idempotent-001.csv
  - id: MEDIA-100-dogs
    status: provisional
    band: content_inference
    priority: 500
    kind: content_inference
    owner: operator
    description: Provisional Dogs-domain candidate for family media.
    rationale: Dog intent may influence a family-media taxonomy but is not a live
      classification guarantee. The historical 'Dogs wins over People' precedence
      is recorded as intent and is not encoded as an automatic override while OD-012
      is open.
    notes: Dogs-over-People precedence is an operator claim awaiting the handwritten
      rule transcriptions referenced by OD-012. Until then a dog+person image is a
      conflict and must reach a human, not an automatic Dogs destination.
    tags:
    - dogs
    - family
    - provisional
    policy_ref:
    - OD-012
    applies_to:
      media_kinds:
      - image
      - video
      source_root_refs:
      - fixture_source_root
    privacy_classification: none
    when:
      all:
      - predicate:
          field: media_kind
          op: in
          value:
          - image
          - video
          evidence_source: media_metadata
      - predicate:
          field: detected_objects
          op: any_of
          value:
          - dog
          evidence_source: media_metadata
      - predicate:
          field: source_root_ref
          op: equals
          value: fixture_source_root
          evidence_source: path
    then:
      outcome: route_to_review
      destination: 02_FAMILY_VAULT/Dogs/{capture_year}
      destination_authority: advisory_only
      review_state: review_required
      explanation_template: Dog detected in media; Dogs is the proposed family-media
        destination pending operator policy.
      fallback: route_to_review
    confidence:
      minimum: 0.9
      below_minimum_outcome: route_to_review
    conflict:
      mode: manual_review
      on_multi_destination: manual_review
      merge_content: false
    evidence:
      required:
      - path
      - content_hash
      - media_metadata
    confirmation:
      required: true
      confirmer_role: operator
    tests:
      positive:
      - tests/fixtures/rules/media-dog/positive-001.jpg
      negative:
      - tests/fixtures/rules/media-dog/negative-001.txt
      boundary:
      - tests/fixtures/rules/media-dog/boundary-001.png
      conflict:
      - tests/fixtures/rules/media-dog/conflict-001.jpg
      idempotency:
      - tests/fixtures/rules/media-dog/idempotent-001.jpg
  - id: MEDIA-050-known-person-candidate
    status: disabled
    band: ai_assisted
    priority: 200
    kind: ai_assisted
    owner: operator
    description: Disabled sensitive-identity candidate. Present as documented intent
      only.
    rationale: Person identity is sensitive. This rule stays disabled until OD-003
      approves an identity-recognition privacy policy, and it can never produce an
      executable destination because its evidence set includes an untrusted AI suggestion.
    notes: Disabled by default until identity-recognition policy is approved (V1-ACC-023).
    tags:
    - identity
    - sensitive
    - disabled
    policy_ref:
    - OD-003
    - OD-012
    applies_to:
      media_kinds:
      - image
      - video
      source_root_refs:
      - fixture_source_root
    privacy_classification: sensitive_identity
    when:
      all:
      - predicate:
          field: media_kind
          op: equals
          value: image
          evidence_source: media_metadata
      - predicate:
          field: person_count
          op: equals
          value: 1
          evidence_source: ai_suggestion
      - predicate:
          field: identity_signal
          op: present
          evidence_source: ai_suggestion
    then:
      outcome: route_to_review
      destination: 02_FAMILY_VAULT/People/Needs-Confirmation/{capture_year}
      destination_authority: advisory_only
      review_state: review_required
      explanation_template: Single-person signal is a candidate only; identity is
        never certain without stronger evidence and explicit operator confirmation.
      fallback: route_to_review
      follow_up:
      - request_operator_confirmation
      - open_review_item
    confidence:
      minimum: 0.98
      below_minimum_outcome: route_to_review
    conflict:
      mode: manual_review
      on_multi_destination: manual_review
      merge_content: false
    evidence:
      required:
      - media_metadata
      - ai_suggestion
      - operator_confirmation
      untrusted:
      - ai_suggestion
    confirmation:
      required: true
      confirmer_role: policy_owner
    tests:
      positive:
      - tests/fixtures/rules/person-candidate/positive-001.jpg
      negative:
      - tests/fixtures/rules/person-candidate/negative-001.jpg
      boundary:
      - tests/fixtures/rules/person-candidate/boundary-001.jpg
      conflict:
      - tests/fixtures/rules/person-candidate/conflict-001.jpg
      idempotency:
      - tests/fixtures/rules/person-candidate/idempotent-001.jpg
  - id: FALLBACK-000-unresolved
    status: active
    band: fallback
    priority: 0
    kind: manual_override
    owner: operator
    description: Terminal routing fallback when no higher band produced an accepted
      destination.
    rationale: Unresolved is a routing fallback, not a destination endorsement. Every
      file must end in a named disposition, so the fallback always matches and always
      reviews.
    tags:
    - fallback
    - unresolved
    applies_to:
      media_kinds:
      - any
    privacy_classification: none
    when:
      always: true
    then:
      outcome: route_to_review
      destination: 00_MIGRATION_CONTROL/05_Unresolved/Needs-Manual-Review
      destination_authority: advisory_only
      review_state: review_required
      explanation_template: No higher-priority rule produced an accepted destination.
      fallback: preserve_source_and_review
    confidence:
      minimum: 0.0
      below_minimum_outcome: route_to_review
    conflict:
      mode: manual_review
      on_multi_destination: manual_review
      merge_content: false
    evidence:
      required:
      - path
    confirmation:
      required: false
    tests:
      positive:
      - tests/fixtures/rules/unresolved/positive-001.bin
      negative:
      - tests/fixtures/rules/unresolved/negative-001.bin
      boundary:
      - tests/fixtures/rules/unresolved/boundary-001.bin
      conflict:
      - tests/fixtures/rules/unresolved/conflict-001.bin
      idempotency:
      - tests/fixtures/rules/unresolved/idempotent-001.bin
